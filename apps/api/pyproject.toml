[project]
name = "omnimind-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.163.0", "uvicorn==0.38.0", "sqlalchemy==2.0.44",
  "alembic==1.17.2", "psycopg[binary]==3.2.12", "pydantic-settings==2.16.3",
  "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.14.5", "mypy==1.18.2", "pip-audit==2.9.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
