name: Phase 1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_USER: omnimind
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: omnimind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnimind -d omnimind_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      COOKIE_SECURE: 'false'
      DATABASE_URL: postgresql+psycopg://omnimind:ci-only-password@localhost:5432/omnimind_test
      TEST_DATABASE_URL: postgresql+psycopg://omnimind:ci-only-password@localhost:5432/omnimind_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.10'
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pip-audit
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
